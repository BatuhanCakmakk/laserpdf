name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create and publish (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""
      all_platforms:
        description: "Also build macOS and Linux."
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build web app
        run: npm run build

  desktop:
    needs: check
    permissions:
      contents: write
    # Pushes build Windows only; tags and manual runs with all_platforms also build macOS and Linux.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.all_platforms) && '[{"platform":"windows-latest","args":"","name":"windows"},{"platform":"macos-latest","args":"--target universal-apple-darwin","name":"macos"},{"platform":"ubuntu-22.04","args":"","name":"linux"}]' || '[{"platform":"windows-latest","args":"","name":"windows"}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A pushed v* tag, or the version given to a manual run (the tag is created on this commit).
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '' }}
          releaseName: "LaserPDF ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}"
          releaseBody: |
            A lightweight, fast PDF viewer and editor. Also available from the [Microsoft Store](https://apps.microsoft.com/detail/9NWK3HL0L4KB).

            **Downloads**
            - **Windows:** `LaserPDF_*_x64-setup.exe` (recommended) or `.msi`
            - **macOS (Intel + Apple Silicon):** `.dmg`. It is unsigned: right-click → Open the first time.
            - **Linux:** `.deb` or `.AppImage`

            See the README for features and usage.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: laserpdf-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      # Unsigned MSIX for Microsoft Store upload (the Store signs it). Set the MSIX_* repository
      # variables from Partner Center -> Product identity, or the package uses placeholder values.
      - name: Pack MSIX for Microsoft Store
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/pack-msix.ps1

      - name: Upload MSIX
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: laserpdf-msix
          retention-days: 7
          if-no-files-found: error
          path: src-tauri/target/msix/*.msix
